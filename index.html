<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة النادي</title>
    
    <!-- مكتبات توليد وقراءة الـ QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #2ecc71; --danger: #e74c3c; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        
        /* تلوين الشاشة عند المسح */
        .screen-green { background-color: #d4edda !important; }
        .screen-red { background-color: #f8d7da !important; }

        .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tabs button { flex: 1; padding: 10px; border: none; background: #eee; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .tabs button.active-tab { background: var(--secondary); color: white; }
        
        .section { display: none; }
        
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn-submit { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-submit:disabled { background: #95a5a6; }
        
        .player-card { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 1px solid #eee; border-radius: 5px; margin-bottom: 10px; background: #fff; }
        .status-active { color: var(--success); font-weight: bold; }
        .status-expired { color: var(--danger); font-weight: bold; }
        
        #qrcodeBox { display: flex; justify-content: center; margin-top: 15px; }
        #scanResult { text-align: center; margin-top: 15px; font-weight: bold; font-size: 18px; white-space: pre-line; }
    </style>
</head>
<body>

    <div id="mainContainer" class="container">
        <!-- أزرار التنقل -->
        <div class="tabs">
            <button class="active-tab" onclick="showSection('addSection', this)">تسجيل لاعب</button>
            <button onclick="showSection('playersSection', this)">المشتركين</button>
            <button onclick="showSection('scanSection', this)">فحص QR</button>
        </div>

        <!-- قسم تسجيل لاعب جديد -->
        <div id="addSection" class="section" style="display: block;">
            <form id="addForm">
                <input type="text" id="playerName" placeholder="اسم اللاعب" required>
                <input type="number" id="paymentAmount" placeholder="المبلغ المدفوع" required>
                <select id="planType">
                    <option value="شهري">شهري</option>
                    <option value="أسبوعي">أسبوعي</option>
                    <option value="يومي">يومي</option>
                </select>
                <button type="submit" id="submitBtn" class="btn-submit">حفظ وتوليد الكود</button>
            </form>
            <div id="qrcodeBox"></div>
        </div>

        <!-- قسم قائمة المشتركين -->
        <div id="playersSection" class="section">
            <!-- زر المزامنة (مخفي افتراضياً) -->
            <button id="syncBtn" onclick="syncOfflineData()" style="display: none; background-color: var(--danger); color: white; font-weight: bold;"></button>
            
            <input type="text" id="searchInput" placeholder="ابحث عن اسم اللاعب..." onkeyup="filterPlayers()">
            <div id="playersList">جاري التحميل...</div>
        </div>

        <!-- قسم قارئ الباركود -->
        <div id="scanSection" class="section">
            <div id="reader"></div>
            <div id="scanResult">امسح كود اللاعب</div>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت الرئيسي -->
    <script src="app.js"></script>

    <!-- تسجيل Service Worker ليعمل التطبيق بدون إنترنت -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }
    </script>
</body>
</html>
