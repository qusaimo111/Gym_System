<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة النادي</title>
    <link rel="manifest" href="manifest.json">
    <!-- مكتبات توليد وقراءة الـ QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

   <link rel="stylesheet" href="style.css">
    <style> .section { display: none; } </style>
</head>
<body>

    <div id="mainContainer" class="container">
        <img src="icon-192.png" alt="شعار النادي" style="width: 150px; display: block; margin: 0 auto 20px;">
        <!-- أزرار التنقل -->
        <div class="tabs">
            <button class="active-tab" onclick="showSection('addSection', this)">تسجيل لاعب</button>
            <button onclick="showSection('playersSection', this)">المشتركين</button>
            <button onclick="showSection('scanSection', this)">فحص QR</button>
        </div>

        <!-- قسم تسجيل لاعب جديد -->
        <div id="addSection" class="section" style="display: block;">
            <form id="addForm">
                <input type="text" id="playerName" placeholder="اسم اللاعب" required>
                 <input type="number" id="paymentAmount" placeholder="المبلغ المدفوع" required>
                 <input type="date" id="joinDateInput" required> <!-- هذا هو الحقل الجديد -->
                <select id="planType">
                    <option value="شهري">شهري</option>
                    <option value="أسبوعي">أسبوعي</option>
                    <option value="يومي">يومي</option>
                </select>
                
                <button type="submit" id="submitBtn" class="btn-submit">حفظ وتوليد الكود</button>
            </form>
            <div id="qrcodeBox"></div>
        </div>

        <!-- قسم قائمة المشتركين -->
        <div id="playersSection" class="section">
            <!-- زر المزامنة (مخفي افتراضياً) -->
            <button id="syncBtn" onclick="syncOfflineData()" style="display: none; background-color: var(--danger); color: white; font-weight: bold;"></button>
            
            <input type="text" id="searchInput" placeholder="ابحث عن اسم اللاعب..." onkeyup="filterPlayers()">
            <div id="playersList">جاري التحميل...</div>
        </div>

        <!-- قسم قارئ الباركود -->
        <div id="scanSection" class="section">
            <div id="reader"></div>
            <div id="scanResult">امسح كود اللاعب</div>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت الرئيسي -->
    <script src="app.js"></script>

    <!-- تسجيل Service Worker ليعمل التطبيق بدون إنترنت -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }
    </script>
</body>
</html>
